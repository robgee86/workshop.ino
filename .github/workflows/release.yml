name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    # Native arm64 runner — no QEMU, no cross-compile. The artifacts we produce
    # are aarch64 by construction.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write   # attach the binary to the GitHub Release
      packages: write   # push the image to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build static aarch64 binary
        env:
          CGO_ENABLED: "0"
        # The runner is already arm64, so GOOS/GOARCH default to linux/arm64.
        # CGO off keeps the binary self-contained so `FROM scratch` works.
        run: |
          go build -trimpath -ldflags="-s -w" -o workshopify .
          cp workshopify workshopify-linux-arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attach binary to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: workshopify-linux-arm64
          fail_on_unmatched_files: true
