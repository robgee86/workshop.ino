# workshop.ino — Docker Compose deployment.
#
# Launch it with `docker compose up`, or as a managed service via systemd
# (workshop.ino.service).
#
# Usage:
#   1. Drop your workshop's `content/` folder NEXT TO this file
#   2. Verify the arduino apps folder exists
#   3. `docker compose up -d`
#   4. Visit http://<this-host-ip>:8080/.
#
# Applied files are owned by the `user:` below — defaults to 1000:1000 (the
# arduino user on the device). Edit it for a different owner.

services:
  workshop-ino:
    image: ghcr.io/arduino/workshop.ino:latest
    container_name: workshop.ino
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8080:8080"
    volumes:
      - ./content:/content:ro
      - /home/arduino/ArduinoApps:/apps
