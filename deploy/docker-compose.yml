# workshop.ino — Docker Compose deployment.
#
# Usage:
#   1. Drop your workshop's `content/` folder NEXT TO this file
#      (so the relative path `./content` below resolves correctly).
#   2. `docker compose up -d`
#   3. Visit http://<this-host-ip>:8080/.
#
# Notes:
#  - The image is pulled from GHCR; published from the release pipeline.
#  - Host port 8080 → container 8080. An unprivileged port so this works
#    under rootless Docker too, with no `sysctl` tweaks or root needed.
#  - Content is mounted read-only — instructors edit the files on disk and
#    the server picks up the changes on the next request (no restart needed).
#  - The Arduino apps folder is mounted read-write into the container at /apps,
#    which is where "Apply solution" writes (the image runs with `-apps /apps`).
#    The left side is the device's real apps dir — adjust it if yours differs.
#  - Applied files are owned by the uid:gid the container runs as. Pass the ids
#    at launch:
#        HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose up -d
#    They default to 1000:1000 — the arduino user on the device — when unset.
#  - The Compose spec forbids dots in service keys, hence `workshop-ino`
#    here. The container and image both carry the project's full name
#    (`workshop.ino`).

services:
  workshop-ino:
    image: ghcr.io/arduino/workshop.ino:latest
    container_name: workshop.ino
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      - ./content:/content:ro
      - /home/arduino/ArduinoApps:/apps
