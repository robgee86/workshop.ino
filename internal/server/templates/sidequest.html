{{define "body"}}
<article class="article-detail">
  <a class="ghost-btn back-btn" href="{{.BackURL}}">← Back to {{.BackTitle}}</a>

  <div class="detail-card sidequest-card">
    <p class="detail-eyebrow">◇ Side quest</p>
    <h1 class="detail-title">{{.Heading}}</h1>
    <div class="detail-body markdown">{{.Body}}</div>
  </div>

  <nav class="step-nav">
    <a class="nav-btn prev" rel="prev" href="{{.BackURL}}">
      <span class="nav-arrow">‹</span>
      <span class="nav-text"><span class="nav-dir">Back to</span><span class="nav-title">{{.BackTitle}}</span></span>
    </a>
    <span></span>
  </nav>
  <p class="nav-hint">Press ← to go back</p>
</article>
{{end}}
